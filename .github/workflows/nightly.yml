name: Nightly Build

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Install SwiftLint (if missing)
        run: command -v swiftlint >/dev/null 2>&1 || brew install swiftlint

      - name: Run SwiftLint
        run: |
          swiftlint version
          swiftlint lint --strict --reporter github-actions-logging

  spm-build-test:
    name: SPM Build & Test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-latest
          - xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Cache SPM build
        uses: actions/cache@v4.2.2
        with:
          path: .build
          key: ${{ matrix.runner }}-spm-nightly-${{ hashFiles('Package.swift', '**/Package.resolved') }}
          restore-keys: |
            ${{ matrix.runner }}-spm-nightly-

      - name: Resolve
        run: |
          set -euo pipefail
          swift package resolve

      - name: Build (Release)
        run: |
          set -euo pipefail
          swift build -c release

      - name: Test
        run: |
          set -euo pipefail
          swift test --parallel --enable-code-coverage

  platform-build:
    name: Build (${{ matrix.platform.name }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: iOS Simulator, destination: "generic/platform=iOS Simulator" }
          - { name: macOS, destination: "generic/platform=macOS" }
          - { name: tvOS Simulator, destination: "generic/platform=tvOS Simulator" }
          - { name: watchOS Simulator, destination: "generic/platform=watchOS Simulator" }
          - { name: visionOS Simulator, destination: "generic/platform=visionOS Simulator" }
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build library
        run: |
          set -euo pipefail
          xcodebuild build \
            -scheme PinGuard \
            -destination "${{ matrix.platform.destination }}" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO

  example-app-build:
    name: Example App (${{ matrix.deviceName }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        deviceName:
          - iPhone 17
          - iPhone 17 Pro
          - iPad Pro 13-inch (M4)
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Sanitize device name for cache key
        id: dest
        run: |
          set -euo pipefail
          raw='${{ matrix.deviceName }}'
          safe="$(echo "$raw" | tr -cd 'A-Za-z0-9')"
          echo "safe=$safe" >> "$GITHUB_OUTPUT"

      - name: Cache Example build artifacts
        uses: actions/cache@v4.2.2
        with:
          path: |
            Example/.build
            Example/.derivedData
          key: ${{ runner.os }}-example-nightly-${{ steps.dest.outputs.safe }}-${{ hashFiles('Package.swift', '**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-example-nightly-${{ steps.dest.outputs.safe }}-
            ${{ runner.os }}-example-nightly-

      - name: Resolve simulator UDID
        id: sim
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/pick_udid.py" <<'PY'
          import json, subprocess, sys

          name = sys.argv[1]
          out = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"], text=True)
          for devices in json.loads(out).get("devices", {}).values():
              for device in devices:
                  if device.get("name") == name and device.get("isAvailable", False):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit(1)
          PY
          UDID="$(python3 "$RUNNER_TEMP/pick_udid.py" '${{ matrix.deviceName }}')" || {
            echo "Simulator not found: ${{ matrix.deviceName }}"
            xcrun simctl list devices available
            exit 1
          }
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Resolve packages (Example)
        working-directory: Example
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project Example.xcodeproj \
            -scheme Example \
            -clonedSourcePackagesDirPath .build \
            -derivedDataPath .derivedData

      - name: Build (Example)
        working-directory: Example
        run: |
          set -euo pipefail
          xcodebuild build \
            -project Example.xcodeproj \
            -scheme Example \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -configuration Debug \
            -clonedSourcePackagesDirPath .build \
            -derivedDataPath .derivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            | tee build.log

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4.5.0
        with:
          name: nightly-example-logs-${{ steps.dest.outputs.safe }}
          path: Example/build.log
          if-no-files-found: ignore

  validate-distribution:
    name: Validate Distribution
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Validate Package.swift
        run: |
          set -euo pipefail
          swift package dump-package > /dev/null

      - name: Build macOS + iOS 15 Simulator
        run: |
          set -euo pipefail

          swift build -c release

          ARCH="$(uname -m)"
          if [ "$ARCH" = "arm64" ]; then
            TRIPLE="arm64-apple-ios15.0-simulator"
          else
            TRIPLE="x86_64-apple-ios15.0-simulator"
          fi

          SDKROOT="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          swift build -c release --sdk "$SDKROOT" --triple "$TRIPLE"

  extended-validation:
    name: Extended Validation
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Show dependencies
        run: |
          set -euo pipefail
          swift package show-dependencies

      - name: Code statistics (best-effort)
        run: |
          set -euo pipefail
          echo "Total Swift files: $(find Sources Tests -name '*.swift' | wc -l)"
          echo "Total lines: $(find Sources Tests -name '*.swift' -exec cat {} \; | wc -l)"

      - name: README basic link sanity
        run: |
          set -euo pipefail
          if grep -E '\]\(\s*\)' README.md; then
            echo "Found empty link in README"
            exit 1
          fi
          echo "README link sanity OK"

  notify-on-failure:
    name: Notify on Failure (scheduled only)
    runs-on: ubuntu-latest
    needs:
      - lint
      - spm-build-test
      - platform-build
      - example-app-build
      - validate-distribution
      - extended-validation
    if: failure() && github.event_name == 'schedule'
    steps:
      - name: Create issue if none open
        uses: actions/github-script@v7.0.1
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;

            const q = `repo:${owner}/${repo} is:issue is:open in:title "Nightly Build Failed"`;
            const res = await github.rest.search.issuesAndPullRequests({ q, per_page: 1 });
            if (res.data.items.length > 0) {
              core.info('An open nightly failure issue already exists. Skipping creation.');
              return;
            }

            const body = [
              '## Nightly Build Failure',
              '',
              'Scheduled nightly build failed.',
              '',
              `- Run: ${runUrl}`,
              `- Date: ${new Date().toISOString().split('T')[0]}`,
              '',
              'Next:',
              '1) Check logs',
              '2) Fix root cause',
              '3) Close this issue'
            ].join('\n');

            await github.rest.issues.create({
              owner, repo,
              title: 'Nightly Build Failed',
              body
            });

  nightly-success:
    name: Nightly Success
    runs-on: ubuntu-latest
    needs:
      - lint
      - spm-build-test
      - platform-build
      - example-app-build
      - validate-distribution
      - extended-validation
    if: always()
    steps:
      - name: Ensure all jobs succeeded
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.spm-build-test.result }}" != "success" ] || \
             [ "${{ needs.platform-build.result }}" != "success" ] || \
             [ "${{ needs.example-app-build.result }}" != "success" ] || \
             [ "${{ needs.validate-distribution.result }}" != "success" ] || \
             [ "${{ needs.extended-validation.result }}" != "success" ]; then
            echo "Nightly failed"
            exit 1
          fi
          echo "Nightly passed"
