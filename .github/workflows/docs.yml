name: Documentation

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build DocC
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build documentation for static hosting
        run: |
          set -euo pipefail
          # The archive docbuild writes is already in static hosting form, so the base path
          # has to go in here; a later `docc process-archive` call would not rewrite it.
          BASE_PATH="${{ github.event.repository.name }}"
          xcodebuild docbuild \
            -scheme PinGuard \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath .derivedData \
            OTHER_DOCC_FLAGS="--warnings-as-errors --transform-for-static-hosting --hosting-base-path ${BASE_PATH}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Prepare site
        run: |
          set -euo pipefail
          ARCHIVE="$(find .derivedData -name 'PinGuard.doccarchive' -type d | head -n 1)"
          if [ -z "$ARCHIVE" ]; then
            echo "::error::PinGuard.doccarchive not found"
            exit 1
          fi

          BASE_PATH="${{ github.event.repository.name }}"
          cp -R "$ARCHIVE" site

          cat > site/index.html << EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=/${BASE_PATH}/documentation/pinguard/">
            <title>PinGuard Documentation</title>
          </head>
          <body>
            <a href="/${BASE_PATH}/documentation/pinguard/">PinGuard Documentation</a>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
